<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 전공별 취업률 예측 시스템</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;padding:30px 16px;
}
.wrap{max-width:720px;margin:0 auto}
.header{text-align:center;margin-bottom:24px;color:#fff}
.header h1{font-size:24px;font-weight:900;margin-bottom:6px}
.header h1 span{color:#4fc3f7}
.header p{font-size:13px;opacity:.6}

.card{background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 24px 64px rgba(0,0,0,.35)}

.form-row{display:flex;gap:14px;margin-bottom:16px}
.form-group{flex:1}
.form-group label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:7px;letter-spacing:.5px}
select,input[type=number]{
  width:100%;padding:13px 15px;border:1.5px solid #e0e4ec;
  border-radius:12px;font-size:15px;font-family:inherit;background:#f8faff;
  transition:border-color .2s;
}
select:focus,input[type=number]:focus{border-color:#1a73e8;outline:none}
button{
  width:100%;padding:15px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#1a73e8,#6c3de8);
  color:#fff;font-size:16px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:transform .15s,opacity .2s;
}
button:hover{opacity:.88;transform:translateY(-2px)}

.result-section{display:none;margin-top:28px;border-top:2px solid #f0f4ff;padding-top:28px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.main-result{
  background:linear-gradient(135deg,#e8f0fe,#ede7f6);
  border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:18px;
}
.main-result .label{font-size:13px;font-weight:700;color:#4a4a8a;margin-bottom:8px;letter-spacing:.5px}
.main-result .rate{font-size:56px;font-weight:900;color:#1a1a6e;letter-spacing:-3px;line-height:1}
.main-result .rate span{font-size:22px;opacity:.6}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.cmp-card{background:#f8faff;border:1.5px solid #e4eaf7;border-radius:14px;padding:20px 16px;text-align:center}
.cmp-card .c-label{font-size:12px;color:#888;margin-bottom:8px;font-weight:600}
.cmp-card .c-val{font-size:26px;font-weight:900;color:#222;margin-bottom:6px;letter-spacing:-1px}
.cmp-card .c-sub{font-size:13px;font-weight:600;line-height:1.4}

.trend-section .t-title{font-size:12px;font-weight:700;color:#666;margin-bottom:12px;letter-spacing:.5px}
.trend-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.trend-row .t-name{font-size:12px;color:#555;width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-bar-wrap{flex:1;height:8px;background:#eee;border-radius:99px;overflow:hidden}
.trend-bar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.trend-row .t-pct{font-size:12px;font-weight:700;color:#333;width:44px;text-align:right;flex-shrink:0}

.good{color:#1b8a3a}.bad{color:#d93025}.neu{color:#888}

@media(max-width:500px){
  .form-row,.grid{flex-direction:column;display:flex}
  .grid{display:flex}
  .card{padding:22px 16px}
  .main-result .rate{font-size:44px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📈 <span>AI</span> 전공 취업률 예측 리포트</h1>
    <p>Orange3 전공별 독립 선형회귀 모델 · 2019 – 2040</p>
  </div>
  <div class="card">
    <div class="form-row">
      <div class="form-group">
        <label>① 공시 연도</label>
        <input type="number" id="year" value="2026" min="2019" max="2040">
      </div>
      <div class="form-group">
        <label>② 전공 선택</label>
        <select id="major">

          <option value="9.자연과학/기타">9. 자연과학 / 기타</option>
        </select>
      </div>
    </div>
    <button onclick="run()">🔍 결과 분석하기</button>

    <div class="result-section" id="resultBox">
      <div class="main-result">
        <div class="label" id="mainLabel">예상 취업률</div>
        <div class="rate" id="mainRate">–<span>%</span></div>
      </div>
      <div class="grid">
        <div class="cmp-card">
          <div class="c-label" id="fieldLabel">계열 평균</div>
          <div class="c-val"   id="fieldRate">–</div>
          <div class="c-sub"  id="fieldSub"></div>
        </div>
        <div class="cmp-card">
          <div class="c-label" id="prevLabel">전년도 대비</div>
          <div class="c-val"   id="prevRate">–</div>
          <div class="c-sub"  id="prevSub"></div>
        </div>
      </div>
      <div class="trend-section">
        <div class="t-title">📊 전체 전공 비교</div>
        <div id="allBars"></div>
      </div>
    </div>
  </div>
</div>

const MAJORS = [
  "1.공학(IT)","2.의약보건","3.상경","4.공학(제조)",
  "5.예체능","6.교육","7.사회과학","8.인문","9.자연과학/기타"
];

function run(){
  const year  = parseInt(document.getElementById('year').value, 10);
  const major = document.getElementById('major').value;
  if(year<2019||year>2040){ alert('조회 가능: 2019~2040'); return; }
  const ys=String(year), yp=String(year-1);
  if(!db[ys]||!db[ys][major]){ alert('데이터 없음'); return; }

  const cur  = db[ys][major];
  const prev = db[yp] ? db[yp][major] : null;
  const pm=cur.pred_major, pf=cur.pred_field, fname=cur.field;

  document.getElementById('resultBox').style.display='block';
  document.getElementById('mainLabel').textContent=`${year}년 [${major}] 예상 취업률`;
  document.getElementById('mainRate').innerHTML=`${pm.toFixed(2)}<span>%</span>`;

  // 계열 비교
  const ratio=(pm/pf).toFixed(2);
  document.getElementById('fieldLabel').textContent=`🏢 ${fname} 평균`;
  document.getElementById('fieldRate').textContent=pf.toFixed(2)+'%';
  const fsub=document.getElementById('fieldSub');
  if(pm>pf)      fsub.innerHTML=`🔥 평균의 <span class="good">${ratio}배</span>`;
  else if(pm<pf) fsub.innerHTML=`📉 평균의 <span class="bad">${ratio}배</span>`;
  else           fsub.innerHTML=`<span class="neu">평균과 동일</span>`;

  // 전년도 비교
  document.getElementById('prevLabel').textContent=`📅 ${year-1}년 대비`;
  if(prev){
    const diff=(pm-prev.pred_major);
    document.getElementById('prevRate').textContent=prev.pred_major.toFixed(2)+'%';
    const ps=document.getElementById('prevSub');
    if(diff>0.005)       ps.innerHTML=`▲ <span class="good">${diff.toFixed(2)}%p 상승</span>`;
    else if(diff<-0.005) ps.innerHTML=`▼ <span class="bad">${Math.abs(diff).toFixed(2)}%p 하락</span>`;
    else                 ps.innerHTML=`<span class="neu">변동 없음</span>`;
  } else {
    document.getElementById('prevRate').textContent='–';
    document.getElementById('prevSub').innerHTML=`<span class="neu">비교 불가</span>`;
  }

  // 전체 전공 비교 바
  const allVals = MAJORS.map(m=>({name:m, val:db[ys][m].pred_major}))
                        .sort((a,b)=>b.val-a.val);
  const maxVal  = Math.max(...allVals.map(v=>v.val));
  let html='';
  allVals.forEach(item=>{
    const sel   = item.name===major;
    const color = sel ? '#1a73e8' : '#c5cae9';
    const pct   = (item.val/maxVal*100).toFixed(1);
    html+=`<div class="trend-row">
      <span class="t-name" style="${sel?'font-weight:900;color:#1a1a6e':''}">${item.name}</span>
      <div class="trend-bar-wrap">
        <div class="trend-bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <span class="t-pct" style="${sel?'color:#1a73e8;font-weight:900':''}">${item.val.toFixed(1)}%</span>
    </div>`;
  });
  document.getElementById('allBars').innerHTML=html;
}
</script>
