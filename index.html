<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학과 vs 계열 취업률 비교 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #ff4b4b; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top:10px; }
        .result-box { margin-top: 30px; display: none; }
        .metric-container { display: flex; gap: 10px; }
        .metric { flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #e9ecef; }
        .metric h3 { margin: 0 0 10px 0; font-size: 14px; color: #6c757d; }
        .metric p { margin: 0; font-size: 24px; font-weight: bold; color: #212529; }
        .insight { margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; }
        .good { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .bad { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 AI 기반 취업률 예측 시스템</h1>
    <hr>
    <div class="form-group">
        <label>공시연도 선택 (2020~2040)</label>
        <input type="number" id="year" value="2026" min="2020" max="2040">
    </div>
    <div class="form-group">
        <label>전공 선택</label>
        <select id="major">
            <option value="1.공학(IT)">1.공학(IT)</option>
            <option value="2.의약보건">2.의약보건</option>
            <option value="3.상경">3.상경</option>
            <option value="4.공학(제조)">4.공학(제조)</option>
            <option value="5.예체능">5.예체능</option>
            <option value="6.교육">6.교육</option>
            <option value="7.사회과학">7.사회과학</option>
            <option value="8.인문">8.인문</option>
            <option value="9.자연과학/기타">9.자연과학/기타</option>
        </select>
    </div>
    <button onclick="calculatePrediction()">🎯 AI 예측 및 비교 결과 확인</button>

    <div class="result-box" id="resultBox">
        <div class="metric-container">
            <div class="metric">
                <h3 id="majorLabel">전공 예상 취업률</h3>
                <p id="majorResult">0%</p>
            </div>
            <div class="metric">
                <h3 id="fieldLabel">계열 평균 취업률</h3>
                <p id="fieldResult">0%</p>
            </div>
        </div>
        <div id="insightBox" class="insight"></div>
    </div>
</div>

<script>
    const db = {"2020": {}, "2021": {}, "2022": {}, "2023": {}, "2024": {}, "2025": {}, "2026": {}, "2027": {}, "2028": {}, "2029": {}, "2030": {}, "2031": {}, "2032": {}, "2033": {}, "2034": {}, "2035": {}, "2036": {}, "2037": {}, "2038": {}, "2039": {}, "2040": {}};

    function calculatePrediction() {
        const year = document.getElementById('year').value;
        const major = document.getElementById('major').value;

        if(!db[year] || !db[year][major]) {
            alert("해당 연도의 데이터가 범위를 벗어났습니다.");
            return;
        }

        const data = db[year][major];
        const predMajor = data.pred_major;
        const predField = data.pred_field;
        const diff = predMajor - predField;

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('majorLabel').innerText = `🎯 ${major}`;
        document.getElementById('majorResult').innerText = predMajor.toFixed(2) + '%';
        document.getElementById('fieldLabel').innerText = `🏢 ${data.field} 평균`;
        document.getElementById('fieldResult').innerText = predField.toFixed(2) + '%';

        const insightBox = document.getElementById('insightBox');
        if (diff > 0) {
            insightBox.className = 'insight good';
            insightBox.innerHTML = `🔥 상대적 우위: 계열 평균 대비 <strong>${diff.toFixed(2)}%p</strong> 높습니다.`;
        } else {
            insightBox.className = 'insight bad';
            insightBox.innerHTML = `📉 상대적 열위: 계열 평균 대비 <strong>${Math.abs(diff).toFixed(2)}%p</strong> 낮습니다.`;
        }
    }
</script>
</body>
</html>
